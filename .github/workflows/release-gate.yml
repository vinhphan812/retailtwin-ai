name: Release Gate
on:
  workflow_run:
    workflows:
      - API CI
      - Web CI / CD
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      backend_url:
        description: Backend Cloud Run URL (defaults to deployed service)
        required: false
        type: string
      frontend_url:
        description: Frontend Firebase Hosting URL (defaults to deployed site)
        required: false
        type: string
      smoke_run_id:
        description: Smoke run ID prefix (optional, defaults to auto-generated)
        required: false
        type: string
concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write
  actions: read
  checks: read
  packages: read
env:
  GCP_PROJECT: retailtwin-ai-511002
  GCP_REGION: us-central1
  CLOUD_RUN_SERVICE: retailtwin-api
  PUBSUB_TOPIC: store-events
  STORE_ID: store-001
  FIXTURE_P001: P001
  FIXTURE_P017: P017
jobs:
  # ── Gate: same-SHA barrier ────────────────────────────────────────────────────
  #
  # Fails closed if either "API CI" or "Web CI / CD" is absent, mismatched,
  # pending, or failed for the same head SHA.
  #
  # Uses github.event.workflow_run.head_sha — the SHA the source workflows ran on.
  # NOT github.sha (which is the gate workflow's own SHA).
  #
  gate:
    name: "Gate: Same-SHA CI Barrier"
    runs-on: self-hosted
    # Skip for manual dispatch and for pushes to feature branches.
    # Only run when triggered by workflow_run (after real main deploys) or on main.
    # Guard: workflow_run fires for each completed workflow independently.
    # Fail closed if triggered before the event status is 'completed'.
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.status == 'completed')
    outputs:
      gate_sha: ${{ steps.validate.outputs.gate_sha }}
      gate_passed: ${{ steps.validate.outputs.both_passed }}
    steps:
      - name: Fetch gate SHA
        id: sha
        run: |
          # workflow_run: head_sha is the SHA the triggering workflow ran on.
          # workflow_dispatch: github.sha is the current commit SHA.
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            GATE_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            GATE_SHA="${{ github.sha }}"
          fi
          if [ -z "${GATE_SHA}" ]; then
            echo "::error::Cannot determine git SHA — both github.event.workflow_run.head_sha and github.sha are empty"
            exit 1
          fi
          echo "gate_sha=${GATE_SHA}" >> $GITHUB_OUTPUT
          echo "Gate SHA: ${GATE_SHA}"

      - name: Validate same-SHA success via GitHub REST API
        id: validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GATE_SHA: ${{ steps.sha.outputs.gate_sha }}
        run: |
          set -e
          echo "Validating SHA: ${GATE_SHA}"

          # Fetch most-recent "API CI" run at this exact SHA.
          echo "::group::Query API CI runs for ${GATE_SHA}"
          API_RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/api.yml/runs" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${GATE_SHA}\")][0] | {head_sha, conclusion, status}" \
            2>/dev/null || echo '{"head_sha": null, "conclusion": null, "status": null}')
          echo "${API_RUNS}"
          echo "::endgroup::"

          # Fetch most-recent "Web CI / CD" run at this exact SHA.
          echo "::group::Query Web CI / CD runs for ${GATE_SHA}"
          WEB_RUNS=$(gh api "repos/${{ github.repository }}/actions/workflows/web.yml/runs" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${GATE_SHA}\")][0] | {head_sha, conclusion, status}" \
            2>/dev/null || echo '{"head_sha": null, "conclusion": null, "status": null}')
          echo "${WEB_RUNS}"
          echo "::endgroup::"

          echo "${API_RUNS}" > /tmp/api_run.json
          echo "${WEB_RUNS}" > /tmp/web_run.json

          # Deterministic inline Python evaluator — no external script needed.
          # GATE_SHA is passed as argv[1] to python3, BEFORE the heredoc.
          # The heredoc uses single-quoted 'PYEOF' so shell does not expand
          # ${GATE_SHA} inside the script body — Python reads it via sys.argv[1].
          python3 - "${GATE_SHA}" << 'PYEOF'
          import json, sys
          errors = []
          for label, path in [("API CI", "/tmp/api_run.json"), ("Web CI / CD", "/tmp/web_run.json")]:
              try:
                  run = json.load(open(path))
              except Exception as exc:
                  errors.append(f"{label}: could not parse run JSON: {exc}")
                  continue
              head_sha = run.get("head_sha") or ""
              status   = run.get("status")   or ""
              conc     = run.get("conclusion") or ""
              if not head_sha:
                  errors.append(f"{label}: no run found for SHA {sys.argv[1]}")
              elif status in ("in_progress", "queued", "waiting"):
                  errors.append(f"{label}: run is {status} for SHA {sys.argv[1]}")
              elif conc != "success":
                  errors.append(f"{label}: conclusion={conc or 'null'} (not success) for SHA {sys.argv[1]}")
          ok = not errors
          print(f"::debug::Gate decision: ok={ok}")
          for e in errors:
              print(f"::error::{e}")
          sys.exit(0 if ok else 1)
          PYEOF

          RESULT=$?
          if [ ${RESULT} -eq 0 ]; then
            echo "both_passed=true" >> $GITHUB_OUTPUT
            echo "gate_sha=${GATE_SHA}" >> $GITHUB_OUTPUT
            echo "::notice::Release gate PASSED — both workflows succeeded for SHA ${GATE_SHA}"
          else
            echo "both_passed=false" >> $GITHUB_OUTPUT
            echo "gate_sha=${GATE_SHA}" >> $GITHUB_OUTPUT
            echo "::error::Release gate FAILED — both 'API CI' and 'Web CI / CD' must succeed for the same SHA."
            exit 1
          fi

      - name: Authenticate to Google Cloud (deployed-artifact verification)
        # The gate job has no auth by default — it only validates GitHub API
        # data. workflow_dispatch additionally runs the "Verify deployed
        # artifacts" step below, which calls gcloud. Authenticate only when
        # that step will run, so workflow_run does not pay the WIF cost.
        if: github.event_name == 'workflow_dispatch'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Verify deployed artifacts exist for the SHA
        if: github.event_name == 'workflow_dispatch'
        run: |
          # workflow_dispatch bypasses the workflow_run trigger, so we must
          # independently confirm the SHA has produced deployed artifacts —
          # not just that CI passed, but that the deploy steps ran and landed.
          GATE_SHA="${{ steps.sha.outputs.gate_sha }}"
          ARTIFACT_OK=false

          # ── Backend: container image in Artifact Registry ────────────────────
          echo "::group::Check Artifact Registry for backend image @ ${GATE_SHA}"
          DIGEST=$(gcloud artifacts docker images describe \
            "gcr.io/${{ env.GCP_PROJECT }}/${{ env.CLOUD_RUN_SERVICE }}:${GATE_SHA}" \
            --format="value(image_summary.fully_qualified_digest)" 2>/dev/null || echo "")
          if [ -n "${DIGEST}" ]; then
            echo "✓ Backend image found in Artifact Registry: ${DIGEST}"
            ARTIFACT_OK=true
          else
            echo "::warning::Backend image not found in Artifact Registry for SHA ${GATE_SHA}"
          fi
          echo "::endgroup::"

          # ── Frontend: web-dist artifact (uploaded on every main push) ───────
          echo "::group::Check Actions artifacts for web-dist @ ${GATE_SHA}"
          # Build and artifact names include the SHA when uploaded on push.
          # List artifacts for the run that covered this SHA and check for web-dist.
          WEB_RUN=$(gh api "repos/${{ github.repository }}/actions/workflows/web.yml/runs" \
            --jq "[.workflow_runs[] | select(.head_sha == \"${GATE_SHA}\")][0] | {id, conclusion}" \
            2>/dev/null || echo '{"id": null, "conclusion": null}')
          WEB_RUN_ID=$(echo "${WEB_RUN}" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id','') or '')" 2>/dev/null)
          if [ -n "${WEB_RUN_ID}" ] && [ "${WEB_RUN_ID}" != "None" ]; then
            echo "✓ Web CI / CD run found for SHA ${GATE_SHA} (run ID: ${WEB_RUN_ID})"
            # web-dist is uploaded only on push to main — check the run's artifacts.
            ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${WEB_RUN_ID}/artifacts" \
              --jq ".artifacts[].name" 2>/dev/null || echo "")
            if echo "${ARTIFACTS}" | grep -q "web-dist"; then
              echo "✓ web-dist artifact found for SHA ${GATE_SHA}"
              ARTIFACT_OK=true
            else
              echo "::warning::web-dist artifact NOT found for SHA ${GATE_SHA} — frontend may not have been deployed"
            fi
          else
            echo "::warning::No Web CI / CD run found for SHA ${GATE_SHA}"
          fi
          echo "::endgroup::"

          # Fail if neither backend image nor frontend artifacts are found.
          if [ "${ARTIFACT_OK}" != "true" ]; then
            echo "::error::No deployed artifacts found for SHA ${GATE_SHA} — cannot release from workflow_dispatch without a prior deploy run."
            echo "::error::Trigger the release gate via workflow_run (push to main) to ensure artifacts are deployed first."
            exit 1
          fi

          echo "::notice::Deployed artifacts verified for SHA ${GATE_SHA}"

      - name: Publish gate result
        run: |
          echo "## Release Gate" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate SHA | \`${{ steps.sha.outputs.gate_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Gate Passed | \`${{ steps.validate.outputs.both_passed }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY

  metadata:
    name: Gather Release Metadata
    runs-on: self-hosted
    if: always()
    outputs:
      backend_url: ${{ steps.backend.outputs.url }}
      frontend_url: ${{ steps.frontend.outputs.url }}
      git_sha: ${{ steps.sha.outputs.sha }}
      gate_passed: ${{ needs.gate.outputs.gate_passed || 'true' }}
      cloud_run_revision: ${{ steps.revision.outputs.revision }}
      image_digest: ${{ steps.image.outputs.digest }}
      run_timestamp: ${{ steps.time.outputs.timestamp }}
      smoke_run_id: ${{ steps.run_id.outputs.run_id }}
      gcp_project: ${{ env.GCP_PROJECT }}
      gcp_region: ${{ env.GCP_REGION }}
      demo_data_version: ${{ steps.demo_data.outputs.version }}
      llm_provider: ${{ steps.llm.outputs.provider }}
      llm_model: ${{ steps.llm.outputs.model }}
      is_manual: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set smoke run ID
        id: run_id
        run: |
          RUN_PREFIX="${{ inputs.smoke_run_id || 'smoke' }}"
          RUN_SUFFIX=$(date -u +%Y%m%d%H%M%S)
          RUN_ID="${RUN_PREFIX}-${RUN_SUFFIX}"
          echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          echo "Smoke run ID: ${RUN_ID}"
      - name: Record timestamp
        id: time
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT
      - name: Record Git SHA
        id: sha
        run: |
          # For workflow_run: use head_sha — the SHA the source workflows ran on.
          # For workflow_dispatch: use github.sha (current branch HEAD).
          if [ "${{ github.event_name }}" == "workflow_run" ]; then
            GATE_SHA="${{ github.event.workflow_run.head_sha }}"
          else
            GATE_SHA="${{ github.sha }}"
          fi
          if [ -z "${GATE_SHA}" ]; then
            echo "::error::Cannot determine git SHA"
            exit 1
          fi
          echo "sha=${GATE_SHA}" >> $GITHUB_OUTPUT
          echo "Git SHA: ${GATE_SHA}"
      - name: Authenticate to Google Cloud
        # Authenticate for both workflow_run and workflow_dispatch — the
        # "Resolve backend URL" step below uses gcloud unconditionally, so
        # workflow_dispatch must also have credentials or it fails closed.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - name: Resolve backend URL
        id: backend
        run: |
          if [ -n "${{ inputs.backend_url }}" ]; then
            echo "url=${{ inputs.backend_url }}" >> $GITHUB_OUTPUT
          else
            # Query the deployed Cloud Run service URL.
            URL=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
              --region=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT }} \
              --format="value(status.url)" 2>/dev/null || echo "")
            if [ -z "$URL" ]; then
              echo "::error::Could not resolve backend URL. Set backend_url input or ensure Cloud Run service exists."
              exit 1
            fi
            echo "url=${URL}" >> $GITHUB_OUTPUT
          fi
          echo "Backend URL: ${{ steps.backend.outputs.url }}"
      - name: Resolve frontend URL
        id: frontend
        run: |
          if [ -n "${{ inputs.frontend_url }}" ]; then
            echo "url=${{ inputs.frontend_url }}" >> $GITHUB_OUTPUT
          else
            # Firebase Hosting URL from repo variable (set in web.yml).
            URL="${{ vars.FIREBASE_HOSTING_URL }}"
            if [ -z "$URL" ]; then
              echo "::warning::Could not resolve frontend URL. Set frontend_url input or FIREBASE_HOSTING_URL variable."
              URL="https://retailtwin-ai.web.app"
            fi
            echo "url=${URL}" >> $GITHUB_OUTPUT
          fi
          echo "Frontend URL: ${{ steps.frontend.outputs.url }}"
      - name: Get Cloud Run revision
        id: revision
        run: |
          REV=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format="value(status.latestReadyRevisionName)" 2>/dev/null || echo "")
          if [ -z "${REV}" ]; then
            echo "::error::could not resolve Cloud Run latest ready revision; refusing to release"
            exit 1
          fi
          echo "revision=${REV}" >> $GITHUB_OUTPUT
          echo "Cloud Run revision: ${REV}"
      - name: Get container image digest
        id: image
        run: |
          # Resolve the actual deployed image digest for the gate SHA. Fail closed:
          # if the image for this SHA does not exist in Artifact Registry, the
          # workflow refuses to record a synthetic digest and exits non-zero.
          SHA="${{ steps.sha.outputs.sha }}"
          DIGEST=$(gcloud artifacts docker images describe \
            "gcr.io/${{ env.GCP_PROJECT }}/${{ env.CLOUD_RUN_SERVICE }}:${SHA}" \
            --format="value(image_summary.fully_qualified_digest)" 2>/dev/null || echo "")
          if [ -z "${DIGEST}" ]; then
            echo "::error::deployed backend image for SHA ${SHA} not found; refusing to release"
            exit 1
          fi
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "Image digest: ${DIGEST}"

          # Cross-check: the deployed Cloud Run revision must be serving this image.
          # An older revision serving a previous image is NOT acceptable for a release.
          DEPLOYED_IMAGE=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format="value(status.latestReadyRevisionName)" 2>/dev/null || echo "")
          if [ -z "${DEPLOYED_IMAGE}" ]; then
            echo "::error::could not resolve Cloud Run latest ready revision; refusing to release"
            exit 1
          fi
          DEPLOYED_IMAGE_DIGEST=$(gcloud run revisions describe "${DEPLOYED_IMAGE}" \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format="value(status.imageDigest)" 2>/dev/null || echo "")
          if [ "${DEPLOYED_IMAGE_DIGEST}" != "${DIGEST}" ]; then
            echo "::error::deployed Cloud Run revision ${DEPLOYED_IMAGE} is serving digest ${DEPLOYED_IMAGE_DIGEST:-<empty>}, but gate SHA ${SHA} requires digest ${DIGEST}. refusing to release against a stale revision."
            exit 1
          fi
          echo "Deployed Cloud Run revision ${DEPLOYED_IMAGE} matches gate SHA digest ${DIGEST}"
      - name: Resolve demo data version
        id: demo_data
        run: |
          # Use the release SHA as demo data version identifier.
          DEMO_VERSION="${{ steps.sha.outputs.sha }}"
          echo "version=${DEMO_VERSION}" >> $GITHUB_OUTPUT
          echo "Demo data version: ${DEMO_VERSION}"
      - name: Read LLM configuration from deployed Cloud Run
        id: llm
        run: |
          # Read the actual env values configured on the deployed Cloud Run service.
          # Do NOT manufacture canonical defaults — release evidence must reflect
          # the deployed configuration. Fail closed if either var is missing.
          SERVICE_JSON=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format=json 2>/dev/null || echo "")

          if [ -z "${SERVICE_JSON}" ]; then
            echo "::error::could not read Cloud Run service; refusing to record synthetic LLM config"
            exit 1
          fi

          PROVIDER=$(echo "${SERVICE_JSON}" | jq -r '.spec.template.spec.containers[0].env // [] | map(select(.name=="LLM_PROVIDER")) | .[0].value // ""')
          MODEL=$(echo "${SERVICE_JSON}" | jq -r '.spec.template.spec.containers[0].env // [] | map(select(.name=="LLM_MODEL")) | .[0].value // ""')

          if [ -z "${PROVIDER}" ] || [ -z "${MODEL}" ] || [ "${PROVIDER}" = "null" ] || [ "${MODEL}" = "null" ]; then
            echo "::error::LLM_PROVIDER or LLM_MODEL not configured on deployed Cloud Run service"
            exit 1
          fi

          echo "provider=${PROVIDER}" >> $GITHUB_OUTPUT
          echo "model=${MODEL}" >> $GITHUB_OUTPUT
          echo "LLM provider: ${PROVIDER}, model: ${MODEL}"
      - name: Publish metadata to summary
        run: |
          echo "## Release Metadata" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Run ID | \`${{ steps.run_id.outputs.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Git SHA | \`${{ steps.sha.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | \`${{ steps.time.outputs.timestamp }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Backend URL | \`${{ steps.backend.outputs.url }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend URL | \`${{ steps.frontend.outputs.url }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud Run Revision | \`${{ steps.revision.outputs.revision || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Image Digest | \`${{ steps.image.outputs.digest || 'N/A' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GCP Project | \`${{ env.GCP_PROJECT }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GCP Region | \`${{ env.GCP_REGION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| LLM Provider | \`${{ steps.llm.outputs.provider }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| LLM Model | \`${{ steps.llm.outputs.model }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Demo Data Version | \`${{ steps.demo_data.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
  smoke-backend-health:
    name: 1. Backend Liveness
    runs-on: self-hosted
    needs: [metadata, gate]
    if: always() && needs.metadata.result != 'failure' && needs.gate.outputs.gate_passed == 'true'
    env:
      BACKEND_URL: ${{ needs.metadata.outputs.backend_url }}
      SMOKE_RUN_ID: ${{ needs.metadata.outputs.smoke_run_id }}
      GIT_SHA: ${{ needs.metadata.outputs.git_sha }}
    steps:
      - name: Check /health endpoint
        id: health_check
        run: |
          set -e
          echo "::group::GET /health"
          RESPONSE=$(curl -sS -w "\n---HTTP_CODE:%{http_code}---" \
            --max-time 30 \
            -H "X-Correlation-ID: ${{ env.SMOKE_RUN_ID }}" \
            "${{ env.BACKEND_URL }}/health")
          echo "${RESPONSE}"
          echo "::endgroup::"

          HTTP_CODE=$(echo "${RESPONSE}" | grep -oP '---HTTP_CODE:\K\d+(?=---)')
          BODY=$(echo "${RESPONSE}" | sed 's/---HTTP_CODE:.*//')

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Health check failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          # Validate response fields.
          if ! echo "${BODY}" | grep -q '"status"'; then
            echo "::error::Health response missing 'status' field"
            exit 1
          fi

          # Check for production environment.
          if ! echo "${BODY}" | grep -q '"app_env":"production"'; then
            echo "::error::Backend not in production mode"
            exit 1
          fi

          echo "✓ /health returned OK"
      - name: Publish result to summary
        run: |
          echo "### Smoke Check 1: Backend Liveness" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Endpoint: \`${{ env.BACKEND_URL }}/health\`" >> $GITHUB_STEP_SUMMARY
          echo "Response: HTTP 200, app_env=production" >> $GITHUB_STEP_SUMMARY
  smoke-backend-readiness:
    name: 2. Backend Readiness
    runs-on: self-hosted
    needs: [metadata, gate, smoke-backend-health]
    if: always() && needs.metadata.result != 'failure' && needs.gate.outputs.gate_passed == 'true'
    env:
      BACKEND_URL: ${{ needs.metadata.outputs.backend_url }}
      SMOKE_RUN_ID: ${{ needs.metadata.outputs.smoke_run_id }}
    steps:
      - name: Check /ready endpoint
        id: ready_check
        run: |
          set -e
          echo "::group::GET /ready"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            -H "X-Correlation-ID: ${{ env.SMOKE_RUN_ID }}" \
            "${{ env.BACKEND_URL }}/ready")
          echo "HTTP ${HTTP_CODE}"
          echo "::endgroup::"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Readiness probe failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          echo "✓ /ready returned 200 (service ready for traffic)"
      - name: Publish result to summary
        run: |
          echo "### Smoke Check 2: Backend Readiness" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Endpoint: \`${{ env.BACKEND_URL }}/ready\`" >> $GITHUB_STEP_SUMMARY
          echo "Response: HTTP 200 (ready for load-balanced traffic)" >> $GITHUB_STEP_SUMMARY
  smoke-firestore-store:
    name: 3. Firestore-Backed Store Read
    runs-on: self-hosted
    needs: [metadata, gate, smoke-backend-readiness]
    if: always() && needs.metadata.result != 'failure' && needs.gate.outputs.gate_passed == 'true'
    env:
      BACKEND_URL: ${{ needs.metadata.outputs.backend_url }}
      SMOKE_RUN_ID: ${{ needs.metadata.outputs.smoke_run_id }}
      STORE_ID: ${{ env.STORE_ID }}
      GCP_PROJECT: ${{ env.GCP_PROJECT }}
      CLOUD_RUN_SERVICE: ${{ env.CLOUD_RUN_SERVICE }}
      GCP_REGION: ${{ env.GCP_REGION }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RUNTIME_SA }}
      - name: Verify LIVE_TWIN_BACKEND contract on deployed Cloud Run
        id: backend_contract
        # Fail closed: production contract requires LIVE_TWIN_BACKEND=firestore.
        # The memory backend does not satisfy this gate. Refuse to record PASS.
        run: |
          set -e
          echo "::group::Read LIVE_TWIN_BACKEND from Cloud Run service"
          SERVICE_JSON=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format=json 2>/dev/null || echo "")
          if [ -z "${SERVICE_JSON}" ]; then
            echo "::error::could not read Cloud Run service; cannot verify LIVE_TWIN_BACKEND"
            exit 1
          fi
          BACKEND=$(echo "${SERVICE_JSON}" | jq -r '.spec.template.spec.containers[0].env // [] | map(select(.name=="LIVE_TWIN_BACKEND")) | .[0].value // ""')
          if [ -z "${BACKEND}" ] || [ "${BACKEND}" = "null" ]; then
            echo "::error::LIVE_TWIN_BACKEND is not configured on the deployed Cloud Run service"
            exit 1
          fi
          if [ "${BACKEND}" != "firestore" ]; then
            echo "::error::deployed LIVE_TWIN_BACKEND='${BACKEND}', but the release gate contract requires 'firestore'"
            exit 1
          fi
          echo "✓ LIVE_TWIN_BACKEND=firestore verified on deployed Cloud Run service"
          echo "::endgroup::"
      - name: Check GET /store
        id: store_check
        run: |
          set -e
          echo "::group::GET /store"
          RESPONSE=$(curl -sS -w "\n---HTTP_CODE:%{http_code}---" \
            --max-time 30 \
            -H "X-Correlation-ID: ${{ env.SMOKE_RUN_ID }}" \
            "${{ env.BACKEND_URL }}/store")
          echo "${RESPONSE}"
          echo "::endgroup::"

          HTTP_CODE=$(echo "${RESPONSE}" | grep -oP '---HTTP_CODE:\K\d+(?=---)')
          BODY=$(echo "${RESPONSE}" | sed 's/---HTTP_CODE:.*//')

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Store read failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          # Validate store response structure.
          if ! echo "${BODY}" | grep -q '"store_id"'; then
            echo "::error::Store response missing 'store_id'"
            exit 1
          fi

          if ! echo "${BODY}" | grep -q '"products"'; then
            echo "::error::Store response missing 'products'"
            exit 1
          fi

          # Verify correct store.
          if ! echo "${BODY}" | grep -q "\"store_id\":\"${{ env.STORE_ID }}\""; then
            echo "::error::Wrong store returned (expected ${{ env.STORE_ID }})"
            exit 1
          fi

          echo "✓ /store returned valid Firestore-backed inventory"
      - name: Verify Firestore directly
        # Fail closed: this step is no longer warning-only. A successful
        # direct Firestore read is part of the production contract.
        # Uses the Firestore REST API with the WIF access token obtained via
        # 'gcloud auth print-access-token'; the gcloud Firestore command
        # surface does not expose 'documents describe'.
        id: firestore_direct
        run: |
          set -e
          echo "::group::Direct Firestore verification"
          DOC_PATH="projects/${{ env.GCP_PROJECT }}/databases/(default)/documents/stores/${{ env.STORE_ID }}"
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          HTTP_CODE=$(curl -sS -o /tmp/firestore_doc.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://firestore.googleapis.com/v1/${DOC_PATH}")
          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::Firestore REST read of ${DOC_PATH} returned HTTP ${HTTP_CODE}; cannot verify live store"
            exit 1
          fi
          STORE_ID=$(jq -r '.fields.store_id.stringValue // empty' /tmp/firestore_doc.json)
          if [ -z "${STORE_ID}" ]; then
            echo "::error::Firestore document ${DOC_PATH} is missing required field store_id"
            exit 1
          fi
          echo "✓ Direct Firestore read succeeded for store/${STORE_ID}"
          echo "::endgroup::"
      - name: Publish result to summary
        run: |
          echo "### Smoke Check 3: Firestore-Backed Store Read" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "LIVE_TWIN_BACKEND: \`firestore\` (verified on deployed service)" >> $GITHUB_STEP_SUMMARY
          echo "Endpoint: \`${{ env.BACKEND_URL }}/store\`" >> $GITHUB_STEP_SUMMARY
          echo "Store ID: \`${{ env.STORE_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Direct Firestore read: PASS" >> $GITHUB_STEP_SUMMARY
  smoke-inventory-p001:
    name: 4. P001 Inventory Read
    runs-on: self-hosted
    needs: [metadata, gate, smoke-firestore-store]
    if: always() && needs.metadata.result != 'failure' && needs.gate.outputs.gate_passed == 'true'
    env:
      BACKEND_URL: ${{ needs.metadata.outputs.backend_url }}
      SMOKE_RUN_ID: ${{ needs.metadata.outputs.smoke_run_id }}
      SKU: ${{ env.FIXTURE_P001 }}
    steps:
      - name: Read P001 inventory
        id: p001_check
        run: |
          set -e
          echo "::group::GET /inventory/P001"
          RESPONSE=$(curl -sS -w "\n---HTTP_CODE:%{http_code}---" \
            --max-time 30 \
            -H "X-Correlation-ID: ${{ env.SMOKE_RUN_ID }}" \
            "${{ env.BACKEND_URL }}/inventory/P001")
          echo "${RESPONSE}"
          echo "::endgroup::"

          HTTP_CODE=$(echo "${RESPONSE}" | grep -oP '---HTTP_CODE:\K\d+(?=---)')
          BODY=$(echo "${RESPONSE}" | sed 's/---HTTP_CODE:.*//')

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::P001 read failed with HTTP ${HTTP_CODE}"
            exit 1
          fi

          # Validate P001 response.
          if ! echo "${BODY}" | grep -q '"sku":"P001"'; then
            echo "::error::Wrong SKU returned for P001"
            exit 1
          fi

          # Validate inventory fields.
          for field in shelf_quantity backroom_quantity facings shelf_id; do
            if ! echo "${BODY}" | grep -q "\"${field}\""; then
              echo "::error::Missing field '${field}' in P001 response"
              exit 1
            fi
          done

          echo "✓ P001 inventory read successful"
      - name: Publish result to summary
        run: |
          echo "### Smoke Check 4: P001 Inventory Read" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SKU: P001" >> $GITHUB_STEP_SUMMARY
          echo "Endpoint: \`${{ env.BACKEND_URL }}/inventory/P001\`" >> $GITHUB_STEP_SUMMARY
          echo "Response: HTTP 200, valid inventory structure" >> $GITHUB_STEP_SUMMARY
  smoke-inventory-p017:
    name: 5. P017 Inventory Read (Competition Demo Gate)
    runs-on: self-hosted
    needs: [metadata, gate, smoke-inventory-p001]
    if: always() && needs.metadata.result != 'failure' && needs.gate.outputs.gate_passed == 'true'
    env:
      BACKEND_URL: ${{ needs.metadata.outputs.backend_url }}
      SMOKE_RUN_ID: ${{ needs.metadata.outputs.smoke_run_id }}
      SKU: ${{ env.FIXTURE_P017 }}
    steps:
      - name: Read P017 inventory (mandatory)
        id: p017_check
        run: |
          set -e
          echo "::group::GET /inventory/P017"
          # P017 is the flagship weekend-demand-surge scenario entity (issue #135).
          # A competition-demo release gate MUST NOT pass without P017 seeded.
          HTTP_CODE=$(curl -sS -o /tmp/p017_response.json -w "%{http_code}" \
            --max-time 30 \
            -H "X-Correlation-ID: ${{ env.SMOKE_RUN_ID }}" \
            "${{ env.BACKEND_URL }}/inventory/P017")
          echo "HTTP ${HTTP_CODE}"
          echo "Response: $(cat /tmp/p017_response.json | head -c 500)"
          echo "::endgroup::"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "::error::P017 inventory not found (HTTP ${HTTP_CODE}); demo-readiness requires seeded P017 (weekend demand surge). Run data/seed/demo_seed.py first."
            exit 1
          fi

          # Validate P017 fields.
          BODY=$(cat /tmp/p017_response.json)
          if ! echo "${BODY}" | grep -q '"sku":"P017"'; then
            echo "::error::Wrong SKU returned for P017"
            exit 1
          fi
          for field in shelf_quantity backroom_quantity; do
            if ! echo "${BODY}" | grep -q "\"${field}\""; then
              echo "::error::Missing field '${field}' in P017 response"
              exit 1
            fi
          done

          echo "✓ P017 inventory read successful (flagship scenario entity present)"
      - name: Publish result to summary
        run: |
          echo "### Smoke Check 5: P017 Inventory Read (Competition Demo Gate)" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "SKU: P017 (flagship weekend-demand-surge fixture, issue #135)" >> $GITHUB_STEP_SUMMARY
          echo "Endpoint: \`${{ env.BACKEND_URL }}/inventory/P017\`" >> $GITHUB_STEP_SUMMARY
          echo "Response: HTTP 200, valid inventory structure" >> $GITHUB_STEP_SUMMARY
  smoke-pubsub-event:
    name: 6. Pub/Sub Deterministic Event Trigger
    runs-on: self-hosted
    needs: [metadata, gate, smoke-inventory-p017]
    if: always() && needs.metadata.result != 'failure' && needs.gate.outputs.gate_passed == 'true'
    env:
      GCP_PROJECT: ${{ env.GCP_PROJECT }}
      PUBSUB_TOPIC: ${{ env.PUBSUB_TOPIC }}
      SMOKE_RUN_ID: ${{ needs.metadata.outputs.smoke_run_id }}
      GIT_SHA: ${{ needs.metadata.outputs.git_sha }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RUNTIME_SA }}
      - name: Verify Pub/Sub topic exists
        id: pubsub_check
        run: |
          set -e
          echo "::group::gcloud pubsub topics describe"
          TOPIC_PATH="projects/${{ env.GCP_PROJECT }}/topics/${{ env.PUBSUB_TOPIC }}"
          gcloud pubsub topics describe "${{ env.PUBSUB_TOPIC }}" \
            --project="${{ env.GCP_PROJECT }}" 2>&1 | head -20
          echo "::endgroup::"

          if [ $? -ne 0 ]; then
            echo "::error::Pub/Sub topic '${{ env.PUBSUB_TOPIC }}' not found"
            exit 1
          fi

          echo "✓ Pub/Sub topic '${{ env.PUBSUB_TOPIC }}' exists"
      - name: Publish a deterministic test event
        id: publish_test
        run: |
          set -e
          EVENT_ID="evt-gate-${{ env.GIT_SHA }}-$(date -u +%Y%m%d%H%M%S)"
          CORRELATION_ID="${{ env.SMOKE_RUN_ID }}"
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          PAYLOAD=$(cat <<EOF
          {
            "event_id": "${EVENT_ID}",
            "correlation_id": "${CORRELATION_ID}",
            "event_type": "sale.completed",
            "store_id": "${{ env.STORE_ID }}",
            "sku": "P001",
            "quantity": 1,
            "occurred_at": "${NOW}",
            "source": "release-gate-smoke"
          }
          EOF
          )

          echo "::group::Publish test event to Pub/Sub"
          echo "Event ID: ${EVENT_ID}"
          echo "Payload: ${PAYLOAD}"

          gcloud pubsub topics publish "${{ env.PUBSUB_TOPIC }}" \
            --project="${{ env.GCP_PROJECT }}" \
            --message="${PAYLOAD}" \
            --attribute=event_id="${EVENT_ID}",correlation_id="${CORRELATION_ID}",event_type="sale.completed",store_id="${{ env.STORE_ID }}" \
            --ordering-key="${EVENT_ID}" 2>&1

          echo "::endgroup::"
          echo "✓ Published deterministic test event to Pub/Sub"
          echo "EVENT_ID=${EVENT_ID}" >> $GITHUB_OUTPUT
          echo "Published event ID: ${EVENT_ID}"
      - name: Verify event in BigQuery
        id: bq_check
        run: |
          set -e
          EVENT_ID="${{ steps.publish_test.outputs.EVENT_ID }}"
          echo "::group::Query BigQuery for event"
          echo "Waiting for event to appear in BigQuery..."

          # Poll BigQuery for up to 60 seconds for the event.
          for i in $(seq 1 12); do
            RESULT=$(bq query --nouse_legacy_sql --format=json \
              "SELECT event_id, event_type, sku, quantity, correlation_id
               FROM \`${{ env.GCP_PROJECT }}.retailtwin.sales_events\`
               WHERE event_id = '${EVENT_ID}'
               LIMIT 1" 2>/dev/null | jq -r '.[0].event_id // empty')

            if [ -n "${RESULT}" ]; then
              echo "✓ Event landed in BigQuery after ${i} iterations"
              echo "::endgroup::"
              return 0
            fi
            echo "Waiting... (attempt ${i}/12)"
            sleep 5
          done

          echo "::warning::Event did not appear in BigQuery within 60 seconds"
          echo "This may be expected if the analytics lander is not yet deployed."
          echo "Event ID: ${EVENT_ID}"
          echo "Correlation ID: ${{ env.SMOKE_RUN_ID }}"
          echo "::endgroup::"
          # Do not fail the gate for analytics pipeline delays.
          # The event was published successfully; BigQuery landing is async.
      - name: Publish result to summary
        run: |
          echo "### Smoke Check 6: Pub/Sub Deterministic Event" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pub/Sub Topic: \`${{ env.PUBSUB_TOPIC }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Event ID: \`${{ steps.publish_test.outputs.EVENT_ID || 'N/A' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Correlation ID: \`${{ env.SMOKE_RUN_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Note: BigQuery landing is async and may lag" >> $GITHUB_STEP_SUMMARY
  smoke-agent-activity:
    name: 7. Agent Activity Verification
    runs-on: self-hosted
