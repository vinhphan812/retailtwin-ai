      - name: Publish result to summary
        run: |
          echo "### Smoke Check 7: Agent Activity Verification" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Endpoint: \`${{ env.BACKEND_URL }}/agent/events\`" >> $GITHUB_STEP_SUMMARY
          echo "Note: Observer/Investigator activity requires full agent pipeline deployment" >> $GITHUB_STEP_SUMMARY
  smoke-secret-scan:
    name: 8. No Secrets in Output
    runs-on: self-hosted
    needs: [metadata, gate, smoke-agent-activity]
    if: always() && needs.metadata.result != 'failure' && needs.gate.outputs.gate_passed == 'true'
    env:
      BACKEND_URL: ${{ needs.metadata.outputs.backend_url }}
      SMOKE_RUN_ID: ${{ needs.metadata.outputs.smoke_run_id }}
    steps:
      - name: Authenticate to Google Cloud
        # Authenticate for both workflow_run and workflow_dispatch — the
        # "Verify environment variables don't leak" step below calls
        # `gcloud run services describe` unconditionally, so both event
        # types need credentials or the step silently swallows the auth
        # failure via `2>/dev/null || echo ""` and the leak check becomes
        # a no-op. Same GCP_RUNTIME_SA used by other smoke jobs.
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_RUNTIME_SA }}
      - name: Scan for secret values in API responses
        id: secret_scan
        run: |
          set -e
          echo "::group::Secret scan of API responses"

          # Endpoints to check.
          ENDPOINTS="/health /ready /store /inventory/P001"

          # Patterns that should NEVER appear in API output (case-insensitive).
          SECRET_PATTERNS=(
            "sk-[a-zA-Z0-9]{20,}"        # OpenAI-style keys
            "AIza[a-zA-Z0-9_-]{35,}"     # Google API keys
            "ya29\.[a-zA-Z0-9_-]{100,}"  # Google OAuth tokens
            "ghp_[a-zA-Z0-9]{36,}"       # GitHub PATs
            "gho_[a-zA-Z0-9]{36,}"       # GitHub OAuth
            "[a-zA-Z0-9+/]{40,}={0,2}"   # Generic base64 tokens (heuristic)
          )

          VIOLATIONS=0

          for endpoint in ${ENDPOINTS}; do
            echo "Checking ${endpoint}..."
            RESPONSE=$(curl -sS --max-time 30 \
              -H "X-Correlation-ID: ${{ env.SMOKE_RUN_ID }}-scan" \
              "${{ env.BACKEND_URL }}${endpoint}" 2>/dev/null || echo "")

            for pattern in "${SECRET_PATTERNS[@]}"; do
              if echo "${RESPONSE}" | grep -iE "${pattern}" > /dev/null 2>&1; then
                echo "::error::Potential secret detected at ${endpoint} (pattern: ${pattern})"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            done
          done

          echo "::endgroup::"

          if [ ${VIOLATIONS} -gt 0 ]; then
            echo "::error::Secret scan found ${VIOLATIONS} violations"
            exit 1
          fi

          echo "✓ No secret values detected in API responses"
      - name: Verify environment variables don't leak
        run: |
          set -e
          echo "::group::Check Cloud Run environment"
          # Verify production environment variables are clean.
          ENV_VARS=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format="value(spec.template.spec.containers[0].env[*].name)" 2>/dev/null || echo "")

          if [ -n "${ENV_VARS}" ]; then
            echo "Environment variables: ${ENV_VARS}"
            # Check that sensitive env vars don't contain actual secrets.
            for var in ${ENV_VARS}; do
              VALUE=$(gcloud run services describe ${{ env.CLOUD_RUN_SERVICE }} \
                --region=${{ env.GCP_REGION }} \
                --project=${{ env.GCP_PROJECT }} \
                --format="value(spec.template.spec.containers[0].env[?name=='${var}'].value)" 2>/dev/null || echo "")
              if echo "${VALUE}" | grep -iE "(sk-|AIza|ghp_|token|secret|password|key)" > /dev/null 2>&1; then
                # Check if it's a placeholder or actual secret.
                if echo "${VALUE}" | grep -iE "(placeholder|\$\{|your-|xxx|REPLACE)" > /dev/null 2>&1; then
                  echo "✓ ${var} is a placeholder (acceptable)"
                else
                  echo "::warning::${var} may contain a real secret value"
                fi
              fi
            done
          fi
          echo "::endgroup::"
      - name: Publish result to summary
        run: |
          echo "### Smoke Check 8: No Secrets in Output" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Checked endpoints: /health, /ready, /store, /inventory/P001" >> $GITHUB_STEP_SUMMARY
          echo "Secret patterns: OpenAI keys, Google API keys, GitHub tokens, etc." >> $GITHUB_STEP_SUMMARY
  smoke-frontend:
    name: 9. Frontend HTTP Availability
    runs-on: self-hosted
    needs: [metadata, gate, smoke-secret-scan]
    if: always() && needs.metadata.result != 'failure' && needs.gate.outputs.gate_passed == 'true'
    env:
      FRONTEND_URL: ${{ needs.metadata.outputs.frontend_url }}
      SMOKE_RUN_ID: ${{ needs.metadata.outputs.smoke_run_id }}
    steps:
      - name: Check frontend availability
        id: frontend_check
        run: |
          set -e
          echo "::group::Check frontend availability"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --location \
            "${{ env.FRONTEND_URL }}")
          echo "HTTP ${HTTP_CODE}"
          echo "::endgroup::"

          # Accept 200 (OK) or 301/302 (redirect to HTTPS/login).
          if [[ "${HTTP_CODE}" == "200" || "${HTTP_CODE}" == "301" || "${HTTP_CODE}" == "302" ]]; then
            echo "✓ Frontend is reachable"
          else
            echo "::error::Frontend returned unexpected HTTP ${HTTP_CODE}"
            exit 1
          fi
      - name: Verify frontend has expected content
        run: |
          set -e
          echo "::group::Check frontend content"
          CONTENT=$(curl -sS --max-time 30 --location \
            "${{ env.FRONTEND_URL }}" 2>/dev/null | head -c 2000)
          echo "${CONTENT}" | grep -q "html\|<!DOCTYPE\|<html" && {
            echo "✓ Frontend serves HTML content"
          } || {
            echo "::warning::Could not verify frontend HTML content"
          }
          echo "::endgroup::"
      - name: Publish result to summary
        run: |
          echo "### Smoke Check 9: Frontend HTTP Availability" >> $GITHUB_STEP_SUMMARY
          echo "**Status: PASS**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Frontend URL: \`${{ env.FRONTEND_URL }}\`" >> $GITHUB_STEP_SUMMARY
  release-decision:
    name: Release Decision
    runs-on: self-hosted
    needs:
      - metadata
      - gate
      - smoke-backend-health
      - smoke-backend-readiness
      - smoke-firestore-store
      - smoke-inventory-p001
      - smoke-inventory-p017
      - smoke-pubsub-event
      - smoke-agent-activity
      - smoke-secret-scan
      - smoke-frontend
    if: always()
    steps:
      - name: Analyze smoke check results
        id: analyze
        run: |
          echo "## Release Decision" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          FAILED_JOBS=()
          PASSED_JOBS=()
          SKIPPED_JOBS=()

          for job in smoke-backend-health smoke-backend-readiness smoke-firestore-store smoke-inventory-p001 smoke-inventory-p017 smoke-pubsub-event smoke-agent-activity smoke-secret-scan smoke-frontend; do
            RESULT=$(echo "${{ needs.${job}.result }}" 2>/dev/null || echo "unknown")
            case "${RESULT}" in
              success)
                PASSED_JOBS+=("${job}")
                echo "| ${job} | :white_check_mark: PASS |" >> $GITHUB_STEP_SUMMARY
                ;;
              failure)
                FAILED_JOBS+=("${job}")
                echo "| ${job} | :x: FAIL |" >> $GITHUB_STEP_SUMMARY
                ;;
              skipped)
                SKIPPED_JOBS+=("${job}")
                echo "| ${job} | :fast_forward: SKIPPED |" >> $GITHUB_STEP_SUMMARY
                ;;
              *)
                echo "| ${job} | :warning: ${RESULT} |" >> $GITHUB_STEP_SUMMARY
                ;;
            esac
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Summary:** ${#PASSED_JOBS[@]} passed, ${#FAILED_JOBS[@]} failed, ${#SKIPPED_JOBS[@]} skipped" >> $GITHUB_STEP_SUMMARY

          # Store results for rollback step.
          echo "FAILED_COUNT=${#FAILED_JOBS[@]}" >> $GITHUB_ENV
          printf -v FAILED_LIST '%s\n' "${FAILED_JOBS[@]}"
          echo "FAILED_JOBS=${FAILED_LIST}" >> $GITHUB_ENV

          if [ ${#FAILED_JOBS[@]} -gt 0 ]; then
            echo "::error::Release FAILED: ${#FAILED_JOBS[@]} smoke checks failed"
            echo "::error::Failed checks: ${FAILED_JOBS[*]}"
            exit 1
          fi

          echo ""
          echo "All smoke checks passed! Release is cleared."
      - name: Generate release manifest
        if: success()
        run: |
          # Deterministic release tag — defined in same shell as the heredoc so
          # ${TAG} is in scope.  GATE_SHA is a plain shell variable; do NOT pass
          # it via the YAML env: block — Actions splits long values at ~50 chars.
          GATE_SHA="${{ needs.metadata.outputs.git_sha }}"
          DATE_PART=$(date -u +%Y%m%d)
          TAG="release/${DATE_PART}-${GATE_SHA:0:8}"
          echo "Release tag: ${TAG}"

          # Double-quoted delimiter so bash expands ${TAG}.  GitHub Actions ${{ }}
          # expressions are escaped as \${{ }} — bash turns \$ into a literal \ so
          # \${{ X }} → the literal string ${{ X }}, which GitHub Actions then
          # re-expands at workflow parse time with the actual output values.
          cat >> $GITHUB_STEP_SUMMARY << "MANIFEST_EOF"

          ## Release Manifest

          ```json
          {
            "smoke_run_id": "\${{ needs.metadata.outputs.smoke_run_id }}",
            "git_sha": "\${{ needs.metadata.outputs.git_sha }}",
            "timestamp": "\${{ needs.metadata.outputs.run_timestamp }}",
            "backend": {
              "url": "\${{ needs.metadata.outputs.backend_url }}",
              "revision": "\${{ needs.metadata.outputs.cloud_run_revision || 'N/A' }}",
              "image_digest": "\${{ needs.metadata.outputs.image_digest || 'N/A' }}"
            },
            "frontend": {
              "url": "\${{ needs.metadata.outputs.frontend_url }}"
            },
            "gcp": {
              "project": "\${{ needs.metadata.outputs.gcp_project }}",
              "region": "\${{ needs.metadata.outputs.gcp_region }}"
            },
            "llm": {
              "provider": "\${{ needs.metadata.outputs.llm_provider }}",
              "model": "\${{ needs.metadata.outputs.llm_model }}"
            },
            "demo_data": {
              "version": "\${{ needs.metadata.outputs.demo_data_version }}"
            },
            "smoke_checks": [
              {"name": "backend_liveness", "status": "PASS"},
              {"name": "backend_readiness", "status": "PASS"},
              {"name": "firestore_store_read", "status": "PASS"},
              {"name": "p001_inventory_read", "status": "PASS"},
              {"name": "p017_inventory_read", "status": "PASS"},
              {"name": "pubsub_event_trigger", "status": "PASS"},
              {"name": "agent_activity", "status": "PASS"},
              {"name": "no_secrets_in_output", "status": "PASS"},
              {"name": "frontend_availability", "status": "PASS"}
            ],
            "release_status": "PASS",
            "release_tag": "${TAG}"
          }
          ```
          MANIFEST_EOF
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release Tag:** \`${TAG}\`" >> $GITHUB_STEP_SUMMARY

      - name: Note on release tag
        if: success()
        run: |
          echo "::notice::Release tag informational only (not created in this workflow): ${TAG}"
          echo "::notice::Tag creation requires write permissions and is handled by a separate release workflow."
  rollback:
    name: Rollback Gate
    runs-on: self-hosted
    needs: [metadata, gate, release-decision]
    if: failure() && needs.metadata.result != 'failure'
    env:
      GCP_PROJECT: ${{ env.GCP_PROJECT }}
      GCP_REGION: ${{ env.GCP_REGION }}
      CLOUD_RUN_SERVICE: ${{ env.CLOUD_RUN_SERVICE }}
      SMOKE_RUN_ID: ${{ needs.metadata.outputs.smoke_run_id }}
      GIT_SHA: ${{ needs.metadata.outputs.git_sha }}
    steps:
      - name: Collect failure evidence
        run: |
          echo "## 🚨 RELEASE FAILED — ROLLBACK GATE" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Smoke Run ID:** \`${{ env.SMOKE_RUN_ID }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Git SHA:** \`${{ env.GIT_SHA }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Failed at:** $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "::error::RELEASE FAILED — See failure details below"
          echo "::error::Smoke Run ID: ${{ env.SMOKE_RUN_ID }}"
          echo "::error::Git SHA: ${{ env.GIT_SHA }}"
          echo "::error::Do NOT proceed with this deployment."
      - name: List failed checks
        run: |
          echo "## Failed Smoke Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Extract job results from the workflow run.
          for job in smoke-backend-health smoke-backend-readiness smoke-firestore-store smoke-inventory-p001 smoke-inventory-p017 smoke-pubsub-event smoke-agent-activity smoke-secret-scan smoke-frontend; do
            # Check if this job failed.
            echo "Checking ${job}..."
          done

          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Check the workflow run logs above for details | ❌ FAIL |" >> $GITHUB_STEP_SUMMARY
      - name: Provide rollback command
        run: |
          echo "## Rollback Command" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY

          # Generate rollback commands.
          echo "# 1. Identify the previous revision:" >> $GITHUB_STEP_SUMMARY
          echo "gcloud run revisions list \\" >> $GITHUB_STEP_SUMMARY
          echo "  --service ${{ env.CLOUD_RUN_SERVICE }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --region ${{ env.GCP_REGION }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --project ${{ env.GCP_PROJECT }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --limit 5" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "# 2. Roll back to the previous revision:" >> $GITHUB_STEP_SUMMARY
          echo "gcloud run services update-traffic \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ env.CLOUD_RUN_SERVICE }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --to-revisions PREVIOUS_REVISION=100 \\" >> $GITHUB_STEP_SUMMARY
          echo "  --region ${{ env.GCP_REGION }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --project ${{ env.GCP_PROJECT }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "# 3. Verify rollback:" >> $GITHUB_STEP_SUMMARY
          echo "curl -sS ${{ needs.metadata.outputs.backend_url }}/health | jq ." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo ""
          echo "::error::ROLLBACK COMMAND:"
          echo "::error::gcloud run services update-traffic ${{ env.CLOUD_RUN_SERVICE }} --to-revisions PREVIOUS_REVISION=100 --region ${{ env.GCP_REGION }} --project ${{ env.GCP_PROJECT }}"
          echo ""
          echo "Save these run IDs for debugging:"
          echo "- Smoke Run ID: ${{ env.SMOKE_RUN_ID }}"
          echo "- Git SHA: ${{ env.GIT_SHA }}"
          echo "- Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
      - name: Archive failure logs
        if: always()
        run: |
          # Create a structured failure record for debugging.
          mkdir -p release-failure
          cat > release-failure/manifest.json << EOF
          {
            "smoke_run_id": "${{ env.SMOKE_RUN_ID }}",
            "git_sha": "${{ env.GIT_SHA }}",
            "failed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run_url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "workflow_run_id": "${{ github.run_id }}",
            "backend_url": "${{ needs.metadata.outputs.backend_url }}",
            "frontend_url": "${{ needs.metadata.outputs.frontend_url }}",
            "gcp_project": "${{ env.GCP_PROJECT }}",
            "gcp_region": "${{ env.GCP_REGION }}",
            "cloud_run_service": "${{ env.CLOUD_RUN_SERVICE }}",
            "cloud_run_revision": "${{ needs.metadata.outputs.cloud_run_revision || 'unknown' }}",
            "llm_provider": "${{ needs.metadata.outputs.llm_provider }}",
            "llm_model": "${{ needs.metadata.outputs.llm_model }}",
            "demo_data_version": "${{ needs.metadata.outputs.demo_data_version }}",
            "release_status": "FAIL",
            "rollback_required": true
          }
          EOF

          echo "Failure manifest:"
          cat release-failure/manifest.json
      - name: Upload failure artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-failure-${{ env.SMOKE_RUN_ID }}
          path: release-failure/
          retention-days: 30
          compression-level: 9
      - name: Set release failed status
        if: always()
        run: |
          echo "::notice::Release gate FAILED"
          echo "::notice::Run ID: ${{ env.SMOKE_RUN_ID }}"
          echo "::notice::Review the failure manifest and logs above."
          echo "::notice::Execute rollback command if the new deployment is unacceptable."

  # ── SBOM gate (ADR 0026 / Issue #146) ──────────────────────────────────────────────
  # The 11-stage smoke gate (ADR 0027) and the SBOM gate (ADR 0026) are parallel
  # independent gates. Both run after the API image is pushed. The SBOM gate
  # produces CycloneDX + SPDX artifacts for the backend container image so that
  # an incident responder can answer "what was in retailtwin-api@sha-abc?" from
  # the repo alone. The smoke gate verifies the deployed service is live.
  # Both gates are required; neither supersedes the other.
  sbom-backend:
    name: Backend SBOM
    runs-on: self-hosted
    # Only run on push to main (not on every workflow_run, to avoid duplicate runs
    # when both gates are triggered simultaneously). The workflow_dispatch path
    # is covered by the main smoke gate already.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag and digest
        id: resolve
        run: |
          set -euo pipefail
          TAG="gcr.io/retailtwin-ai-511002/retailtwin-api:${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if command -v docker >/dev/null 2>&1; then
            docker pull --quiet "${TAG}" >/dev/null 2>&1 || true
            DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${TAG}" 2>/dev/null \
              | sed -E 's#^[^@]+@##' || true)
          fi
          echo "digest=${DIGEST:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Generate CycloneDX SBOM for backend image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ steps.resolve.outputs.tag }}
          format: cyclonedx-json
          artifact-name: sbom-backend-cyclonedx

      - name: Generate SPDX SBOM for backend image
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: ${{ steps.resolve.outputs.tag }}
          format: spdx-json
          artifact-name: sbom-backend-spdx

      - name: Assemble release evidence
        env:
          IMAGE_TAG: ${{ steps.resolve.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.resolve.outputs.digest }}
          GIT_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY' > release-evidence.json
          import json, os, pathlib, datetime as dt
          evidence = {
              "service": "retailtwin-api",
              "git_sha": os.environ["GIT_SHA"],
              "image_tag": os.environ["IMAGE_TAG"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "generated_at": dt.datetime.utcnow().replace(microsecond=0).isoformat() + "Z",
              "sbom_artifacts": sorted(p.name for p in pathlib.Path(".").glob("*.spdx.json")),
          }
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
          cat release-evidence.json

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-backend
          path: release-evidence.json
          if-no-files-found: error
          retention-days: 90
