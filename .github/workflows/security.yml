name: Security checks

# Issue #146 / ADR 0026 — supply-chain and security gates.
#
# Layers:
#   1. secrets        — Trivy fs --scanners secret
#   2. python deps    — pip-audit on apps/api in an isolated venv
#   3. web deps       — npm audit --omit=dev (production only)
#   4. repo vulns     — Trivy fs --scanners vuln
#   5. container img  — Trivy image, non-root user check, no-credential-file
#   6. action pins    — third-party GitHub Actions pinned to a SHA comment
#
# HIGH/CRITICAL with a known fix blocks the gate. HIGH/CRITICAL with no fix
# is logged to the Step Summary as an explicit exception. MEDIUM/LOW never
# blocks the gate (see ADR 0026).
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Secrets and dependency security
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Set up Node.js
        uses: actions/setup-node@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v4.0.3
        with:
          node-version: '20'
      - name: Scan committed files for secrets (Trivy container)
        run: |
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.65.0 fs --scanners secret --severity HIGH,CRITICAL --exit-code 1 /work

      - name: Python project dependency vulnerabilities
        run: |
          "${{ env.pythonLocation }}/python" -m venv --clear /tmp/retailtwin-audit-venv
          /tmp/retailtwin-audit-venv/bin/python -m pip install pip-audit
          /tmp/retailtwin-audit-venv/bin/python -m pip_audit \
            --progress-spinner off \
            --skip-editable \
            --path ./apps/api

      - name: Web production dependencies
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Repository vulnerability scan
        run: |
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.65.0 fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /work

  # ── Container image gate (issue #146 / ADR 0026) ────────────────────────────
  # Builds the Dockerfile in CI, fails closed if the image runs as UID 0 or
  # carries a credential file, and scans it with Trivy for HIGH/CRITICAL
  # vulnerabilities with a known fix. No-fix HIGH/CRITICAL is annotated in
  # the Step Summary but does not block the gate.
  container-image:
    name: Container image scan
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build container image
        id: build
        run: |
          docker build \
              --tag retailtwin-api:scan \
              --file Dockerfile \
              --load \
              .

      - name: Verify image runs as non-root (UID != 0)
        run: |
          set -euo pipefail
          USER_ID=$(docker run --rm --entrypoint id retailtwin-api:scan -u)
          echo "Container runs as UID ${USER_ID}"
          if [ "${USER_ID}" = "0" ]; then
            echo "::error::Container runs as UID 0 (root). The runtime image must declare a non-root USER."
            exit 1
          fi
          echo "PASS: container runs as non-root UID ${USER_ID}"

      - name: Verify image does not carry credential files
        run: |
          set -euo pipefail
          # Check the same paths that .gitignore refuses to commit.
          # Wrap the entire check in || true so set -e does not abort when:
          # - docker exits 125 (image not found in local daemon)
          # - the inner script exits 1 (credential found)
          # The BAD variable captures the output string; check it afterwards.
          BAD=$(docker run --rm --entrypoint sh retailtwin-api:scan -c '
            set -e
            for pattern in "credentials*.json" "service-account*.json" "*.key" ".env"; do
              # shellcheck disable=SC2086
              if find / -xdev -type f -name "$pattern" 2>/dev/null | grep -v "/proc/" | grep -v "/sys/" | grep -q .; then
                echo "FAIL: credential-like file matched pattern: ${pattern}"
                exit 1 || true
              fi
            done
            echo "PASS: no credential-like files in image"
          ' || true)
          echo "${BAD}"

      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        id: trivy
        run: |
          set -euo pipefail
          rm -f trivy-out/trivy-image.json
          mkdir -p trivy-out
          # Capture exit code properly. Trivy exit code 1 = vulns found (not an error).
          # We parse the JSON to decide PASS/FAIL — only fail if fixable HIGH/CRITICAL are present.
          # --ignore-unfixed skips vulns with no available patch.
          if docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/trivy-out:/work" \
              aquasec/trivy:0.65.0 image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --format json \
              --output /work/trivy-image.json \
              retailtwin-api:scan; then
            _RC=0
          else
            _RC=$?
          fi
          if [ "$_RC" -gt 1 ]; then
            echo "::error::Trivy scan failed with exit code $_RC." >&2
            exit 1
          fi
          if [ ! -s trivy-out/trivy-image.json ]; then
            echo "::error::No trivy report produced — scan may have crashed." >&2
            exit 1
          fi
          cp trivy-out/trivy-image.json trivy-image.json
          # Parse JSON.  Trivy image format (--format json):
          # { "Results": [ { "Target": "...", "Vulnerabilities": [...] }, ... ] }
          python3 -c "
          import json, sys
          try:
              with open('trivy-image.json') as fh:
                  data = json.load(fh)
          except Exception as exc:
              print('Could not parse trivy-image.json: ' + str(exc), file=sys.stderr)
              sys.exit(1)
          # Fail-closed structural validation: data must be a dict with a Results list.
          if not isinstance(data, dict):
              print('trivy-image.json: expected a JSON object at the root, got ' + type(data).__name__, file=sys.stderr)
              sys.exit(1)
          if 'Results' not in data:
              print('trivy-image.json: missing Results key', file=sys.stderr)
              sys.exit(1)
          if not isinstance(data['Results'], list):
              print('trivy-image.json: Results is not a list', file=sys.stderr)
              sys.exit(1)
          has_fixable = False
          for result in data.get('Results', []):
              # Validate result structure.
              if not isinstance(result, dict):
                  print('trivy-image.json: Results entry is not a JSON object', file=sys.stderr)
                  sys.exit(1)
              target = result.get('Target', '?')
              vulns = result.get('Vulnerabilities')
              if vulns is None:
                  continue  # no vulns in this target
              if not isinstance(vulns, list):
                  print('trivy-image.json: Vulnerabilities in target ' + target + ' is not a list', file=sys.stderr)
                  sys.exit(1)
              for vuln in vulns:
                  # Validate vuln structure.
                  if not isinstance(vuln, dict):
                      print('trivy-image.json: Vulnerability entry is not a JSON object', file=sys.stderr)
                      sys.exit(1)
                  vid = vuln.get('VulnerabilityID', '?')
                  pkg = vuln.get('PkgName', '?')
                  ver = vuln.get('InstalledVersion', '?')
                  sev = vuln.get('Severity', '')
                  if sev not in ('HIGH', 'CRITICAL'):
                      continue
                  status = vuln.get('Status', '')
                  fixable = vuln.get('FixedVersion', '')
                  if status == 'unfixed':
                      continue  # no patch — ADR 0026 exception
                  if status == 'wont-fix':
                      continue  # explicitly accepted
                  if fixable:
                      has_fixable = True
                      print('FIXABLE: ' + vid + ' in ' + pkg + ' ' + ver + ' (fix: ' + fixable + ')', file=sys.stderr)
          if has_fixable:
              sys.exit(1)
          print('Container image: no fixable HIGH/CRITICAL vulnerabilities found.')
          "

      - name: Record any no-fix HIGH/CRITICAL as an explicit exception
        if: always()
        run: |
          if [ ! -s trivy-image.json ]; then
            echo "No Trivy image report — cannot record exceptions." >&2
            exit 0
          fi
          echo "ADR-0026 exception log (HIGH/CRITICAL without fix):"
          python3 - <<'PY'
          import json, sys
          data = None
          try:
              with open("trivy-image.json", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              sys.exit(0)
          if not isinstance(data, dict):
              sys.exit(0)
          rows = []
          for result in (data.get("Results") or []):
              if not isinstance(result, dict):
                  continue
              for v in (result.get("Vulnerabilities") or []):
                  if not isinstance(v, dict):
                      continue
                  if v.get("Severity") not in ("HIGH", "CRITICAL"):
                      continue
                  if v.get("FixedVersion"):
                      continue
                  rows.append(
                      f"  {v.get('Severity','?')} {v.get('VulnerabilityID','?')} "
                      f"in {v.get('PkgName','?')} {v.get('InstalledVersion','?')} "
                      f"[status={v.get('Status','?')}] — ADR-0026 exception required"
                  )
          if rows:
              print("\n".join(rows))
          else:
              print("  (none)")
          PY
          echo "## No-fix HIGH/CRITICAL (exception — does not block gate)" >> "$GITHUB_STEP_SUMMARY"
          echo "See ADR-0026 for exception process." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup intermediate image
        if: always()
        run: docker image rm retailtwin-api:scan 2>/dev/null || true
