name: Security checks
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  scan:
    name: Secrets and dependency security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan committed files for secrets (Trivy)
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: '1'
          severity: HIGH,CRITICAL
      - name: Python project dependency vulnerabilities
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip install ./apps/api
          python -m pip_audit --progress-spinner off --disable-pip
      - name: Web production dependencies
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Repository vulnerability scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          exit-code: '1'
          severity: HIGH,CRITICAL
