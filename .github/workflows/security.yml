name: Security checks

# Issue #146 / ADR 0026 — supply-chain and security gates.
#
# Layers:
#   1. secrets        — Trivy fs --scanners secret
#   2. python deps    — pip-audit on apps/api in an isolated venv
#   3. web deps       — npm audit --omit=dev (production only)
#   4. repo vulns     — Trivy fs --scanners vuln
#   5. container img  — Trivy image, non-root user check, no-credential-file
#   6. action pins    — third-party GitHub Actions pinned to a SHA comment
#
# HIGH/CRITICAL with a known fix blocks the gate. HIGH/CRITICAL with no fix
# is logged to the Step Summary as an explicit exception. MEDIUM/LOW never
# blocks the gate (see ADR 0026).
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    name: Secrets and dependency security
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Scan committed files for secrets (Trivy container)
        run: |
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.65.0 fs --scanners secret --severity HIGH,CRITICAL --exit-code 1 /work

      - name: Python project dependency vulnerabilities
        run: |
          "${{ env.pythonLocation }}/python" --version
          "${{ env.pythonLocation }}/python" -m venv --clear /tmp/retailtwin-app-venv
          "${{ env.pythonLocation }}/python" -m venv --clear /tmp/retailtwin-audit-venv
          # Audit the app's installed dependencies, not the audit tool's own venv.
          # Upgrade pip/setuptools/wheel in the app venv first so wheel builds use patched tooling.
          /tmp/retailtwin-app-venv/bin/python -m pip install --upgrade pip setuptools wheel
          /tmp/retailtwin-app-venv/bin/python -m pip install ./apps/api
          # Audit only the installed app packages (not pip/setuptools/pip-audit).
          /tmp/retailtwin-audit-venv/bin/python -m pip install pip-audit
          /tmp/retailtwin-audit-venv/bin/python -m pip install --upgrade pip
          /tmp/retailtwin-audit-venv/bin/python -m pip_audit --progress-spinner off --skip-editable \
            --project-path /tmp/retailtwin-app-venv

      - name: Web production dependencies
        working-directory: apps/web
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Repository vulnerability scan
        run: |
          docker run --rm -v "$PWD:/work:ro" aquasec/trivy:0.65.0 fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /work

  # ── Container image gate (issue #146 / ADR 0026) ────────────────────────────
  # Builds the Dockerfile in CI, fails closed if the image runs as UID 0 or
  # carries a credential file, and scans it with Trivy for HIGH/CRITICAL
  # vulnerabilities with a known fix. No-fix HIGH/CRITICAL is annotated in
  # the Step Summary but does not block the gate.
  container-image:
    name: Container image scan
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0

      - name: Build container image
        id: build
        run: |
          docker build \
              --tag retailtwin-api:scan \
              --file Dockerfile \
              --load \
              .

      - name: Verify image runs as non-root (UID != 0)
        run: |
          set -euo pipefail
          USER_ID=$(docker run --rm --entrypoint id retailtwin-api:scan -u)
          echo "Container runs as UID ${USER_ID}"
          if [ "${USER_ID}" = "0" ]; then
            echo "::error::Container runs as UID 0 (root). The runtime image must declare a non-root USER."
            exit 1
          fi
          echo "PASS: container runs as non-root UID ${USER_ID}"

      - name: Verify image does not carry credential files
        run: |
          set -euo pipefail
          # Check the same paths that .gitignore refuses to commit.
          # The grep matches files anywhere in the image; a present file fails.
          BAD=$(docker run --rm --entrypoint sh retailtwin-api:scan -c '
            set -e
            for pattern in "credentials*.json" "service-account*.json" "*.key" ".env"; do
              # shellcheck disable=SC2086
              if find / -xdev -type f -name "$pattern" 2>/dev/null | grep -v "/proc/" | grep -v "/sys/" | grep -q .; then
                echo "FAIL: credential-like file matched pattern: ${pattern}"
                exit 1
              fi
            done
            echo "PASS: no credential-like files in image"
          ')
          echo "${BAD}"

      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        id: trivy
        run: |
          set -euo pipefail
          rm -f trivy-out/trivy-image.json trivy-image.json
          mkdir -p trivy-out
          # Trivy with --exit-code 0: waits for full DB download + scan, exits 0 on success.
          # Python parser is the authoritative PASS/FAIL gate.
          # Fail: fixable HIGH/CRITICAL (FixedVersion exists) → exit 1.
          # Exception: unfixed/wont-fix HIGH/CRITICAL → logged, does not fail gate.
          # Fail: malformed JSON, missing report, scanner error → exit 1.
          if ! docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/trivy-out:/work" \
              aquasec/trivy:0.65.0 image \
              --severity HIGH,CRITICAL \
              --format json \
              --output /work/trivy-image.json \
              --exit-code 0 \
              retailtwin-api:scan; then
            echo "::error::Trivy scan execution failed." >&2
            exit 1
          fi
          if [ ! -s trivy-out/trivy-image.json ]; then
            echo "::error::No Trivy report produced — scan may have crashed." >&2
            exit 1
          fi
          cp trivy-out/trivy-image.json trivy-image.json
          python3 - <<'PY'
          import json, sys, os

          data = None
          try:
              with open("trivy-image.json", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"[TRIVY-PARSER] FAIL: could not parse trivy-image.json: {exc}", file=sys.stderr)
              sys.exit(1)

          if not isinstance(data, dict):
              print("[TRIVY-PARSER] FAIL: root must be a JSON object", file=sys.stderr)
              sys.exit(1)
          results = data.get("Results") or []
          if not isinstance(results, list):
              print("[TRIVY-PARSER] FAIL: Results must be a list", file=sys.stderr)
              sys.exit(1)

          has_fixable = False
          exceptions = []
          for result in results:
              if not isinstance(result, dict):
                  print("[TRIVY-PARSER] FAIL: each Results entry must be a JSON object", file=sys.stderr)
                  sys.exit(1)
              vulns = result.get("Vulnerabilities")
              if not vulns:
                  continue
              if not isinstance(vulns, list):
                  print("[TRIVY-PARSER] FAIL: Vulnerabilities must be a list", file=sys.stderr)
                  sys.exit(1)
              for v in vulns:
                  if not isinstance(v, dict):
                      print("[TRIVY-PARSER] FAIL: each vulnerability must be a JSON object", file=sys.stderr)
                      sys.exit(1)
                  sev = v.get("Severity", "")
                  if sev not in ("HIGH", "CRITICAL"):
                      continue
                  fixed = v.get("FixedVersion")
                  vuln_id = v.get("VulnerabilityID", "?")
                  pkg = v.get("PkgName", "?")
                  ver = v.get("InstalledVersion", "?")
                  status = v.get("Status", "")
                  if fixed:
                      has_fixable = True
                      print(f"[TRIVY-PARSER] FAIL: FIXABLE {sev} {vuln_id} in {pkg} {ver} (fix: {fixed})", file=sys.stderr)
                  elif status in ("unfixed", "wont-fix", "unknown"):
                      exceptions.append(f"  EXCEPTION: {sev} {vuln_id} in {pkg} {ver} — no fix available ({status})")
                      print(f"[TRIVY-PARSER] EXCEPTION: {sev} {vuln_id} in {pkg} {ver} (status={status})", file=sys.stderr)
                  else:
                      # No FixedVersion AND not explicitly unfixed/wont-fix — treat as exception too
                      exceptions.append(f"  EXCEPTION: {sev} {vuln_id} in {pkg} {ver} — status={status or 'unknown'}")
                      print(f"[TRIVY-PARSER] EXCEPTION: {sev} {vuln_id} in {pkg} {ver} (status={status or 'unknown'})", file=sys.stderr)

          if has_fixable:
              print("[TRIVY-PARSER] RESULT: FAIL — fixable HIGH/CRITICAL found", file=sys.stderr)
              sys.exit(1)
          if exceptions:
              print(f"[TRIVY-PARSER] RESULT: PASS with {len(exceptions)} unfixed HIGH/CRITICAL exceptions (ADR-0026)", file=sys.stderr)
          else:
              print("[TRIVY-PARSER] RESULT: PASS — no HIGH/CRITICAL vulnerabilities found", file=sys.stderr)
          PY

      - name: Record any no-fix HIGH/CRITICAL as an explicit exception
        if: always()
        run: |
          if [ ! -s trivy-image.json ]; then
            echo "No Trivy image report — cannot record exceptions." >&2
            exit 0
          fi
          echo "ADR-0026 exception log (HIGH/CRITICAL without fix):"
          python3 - <<'PY'
          import json, sys
          data = None
          try:
              with open("trivy-image.json", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception:
              sys.exit(0)
          if not isinstance(data, dict):
              sys.exit(0)
          rows = []
          for result in (data.get("Results") or []):
              if not isinstance(result, dict):
                  continue
              for v in (result.get("Vulnerabilities") or []):
                  if not isinstance(v, dict):
                      continue
                  if v.get("Severity") not in ("HIGH", "CRITICAL"):
                      continue
                  if v.get("FixedVersion"):
                      continue
                  rows.append(
                      f"  {v.get('Severity','?')} {v.get('VulnerabilityID','?')} "
                      f"in {v.get('PkgName','?')} {v.get('InstalledVersion','?')} "
                      f"[status={v.get('Status','?')}] — ADR-0026 exception required"
                  )
          if rows:
              print("\n".join(rows))
          else:
              print("  (none)")
          PY
          echo "## No-fix HIGH/CRITICAL (exception — does not block gate)" >> "$GITHUB_STEP_SUMMARY"
          echo "See ADR-0026 for exception process." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup intermediate image
        if: always()
        run: docker image rm retailtwin-api:scan 2>/dev/null || true
