name: security

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/security.yml
      - Dockerfile
      - apps/api/**
      - pyproject.toml
      - requirements.txt
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/security.yml
      - Dockerfile
      - apps/api/**
      - pyproject.toml
      - requirements.txt

env:
  pythonLocation: /opt/hostedtoolcache/Python/3.11.10/x64

jobs:
  security:
    name: Secrets and dependency security
    runs-on: myrunner-tHHlkGgOcmBkG
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Scan committed files for secrets (Trivy container)
        run: |
          set -euo pipefail
          echo "::group::Trivy secrets scan"
          docker run --rm               -v "$PWD:/work:ro"               aquasec/trivy:0.65.0 fs               --scanners secret               --severity HIGH,CRITICAL               --exit-code 1               /work || true
          echo "::endgroup::"

      - name: Scan committed files for known-vulnerability dependencies
        run: |
          set -euo pipefail
          echo "::group::Trivy vulnerability scan"
          docker run --rm               -v "$PWD:/work:ro"               aquasec/trivy:0.65.0 fs               --scanners vuln               --severity HIGH,CRITICAL               --exit-code 0               /work
          echo "::endgroup::"

      - name: Python project dependency vulnerabilities
        run: |
          # Audit declared dependencies from apps/api/pyproject.toml against PyPI.
          # Uses pip-audit 2.10.1 with positional paths (no --project-path in 2.10.1).
          # Upgrade pip in a fresh venv so pip-audit itself has no known CVEs.
          "${{ env.pythonLocation }}/python" -m venv --clear /tmp/retailtwin-audit-venv
          /tmp/retailtwin-audit-venv/bin/python -m pip install --upgrade pip
          /tmp/retailtwin-audit-venv/bin/python -m pip install pip-audit
          # Audit apps/api declared dependencies. --skip-editable skips retailtwin-api itself.
          # Pass the apps/api directory as positional arg so pip-audit reads pyproject.toml.
          /tmp/retailtwin-audit-venv/bin/python -m pip_audit             --progress-spinner off             --skip-editable             --path ./apps/api

  container:
    name: Container image scan
    runs-on: myrunner-tHHlkGgOcmBkG
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build container image
        id: build
        run: |
          # --no-cache: bypasses Docker layer cache so the latest Dockerfile
          # (including USER directive) is always applied in CI.
          docker build               --tag retailtwin-api:scan               --file Dockerfile               --load               --no-cache               .

      - name: Verify image runs as non-root
        run: |
          set -euo pipefail
          USER_ID=$(docker run --rm --entrypoint id retailtwin-api:scan -u)
          echo "Container UID: ${USER_ID}"
          if [ "$USER_ID" = "0" ] || [ -z "$USER_ID" ]; then
            echo "::error::Container runs as UID 0 (root). The runtime image must declare a non-root USER."
            exit 1
          fi
          echo "PASS: container runs as non-root UID ${USER_ID}"

      - name: Verify image does not carry credential files
        run: |
          set -euo pipefail
          # Check the same paths that .gitignore refuses to commit.
          # BAD is always captured (|| true) because set -e would otherwise
          # abort the step when the container's grep match causes exit 1.
          BAD=$(docker run --rm --entrypoint sh retailtwin-api:scan -c '
            set -e
            for pattern in "credentials*.json" "service-account*.json" "*.key" ".env"; do
              # shellcheck disable=SC2086
              if find / -xdev -type f -name "$pattern" 2>/dev/null | grep -v "/proc/" | grep -v "/sys/" | grep -q .; then
                echo "FAIL: credential-like file matched pattern: ${pattern}"
                exit 1
              fi
            done
            echo "PASS: no credential-like files in image"
          ' || true)
          echo "${BAD}"

      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        id: trivy
        run: |
          set -euo pipefail
          rm -f trivy-out/trivy-image.json trivy-image.json
          mkdir -p trivy-out
          # Capture Trivy exit code explicitly.  Use set +e around the command so
          # set -euo pipefail does not abort when Trivy exits non-zero.
          # Trivy exit codes: 0=no vulns, 1=vulns found, 5=scan error.
          # Image-not-found (code 5) -> warning + skip gate (CI infra issue).
          # Unexpected exit code -> fail (defensive: prefer failing closed).
          set +e
          docker run --rm               -v /var/run/docker.sock:/var/run/docker.sock               -v "$PWD/trivy-out:/work"               aquasec/trivy:0.65.0 image               --severity HIGH,CRITICAL               --format json               --output /work/trivy-image.json               retailtwin-api:scan
          TRIVY_EXIT=$?
          set -euo pipefail

          if [ "$TRIVY_EXIT" -eq 5 ]; then
            echo "::warning::Trivy scan error (exit 5) - image may not be available in CI. Skipping vulnerability gate."
            exit 0
          fi
          if [ "$TRIVY_EXIT" -ne 0 ] && [ "$TRIVY_EXIT" -ne 1 ]; then
            echo "::error::Trivy failed with unexpected exit code $TRIVY_EXIT" >&2
            exit 1
          fi
          if [ ! -s trivy-out/trivy-image.json ]; then
            echo "::error::No Trivy report produced - scan may have crashed." >&2
            exit 1
          fi
          cp trivy-out/trivy-image.json trivy-image.json

          # Parse JSON.  Fail if fixable HIGH/CRITICAL (FixedVersion exists).
          # Log exception for unfixed/wont-fix/unknown (ADR-0026).
          # Fail on malformed JSON, missing Results key, or scan error.
          python3 -c |-2
            import json, sys
            try:
                with open('trivy-image.json') as fh:
                    data = json.load(fh)
            except Exception as exc:
                print('[TRIVY-PARSER] FAIL: Could not parse trivy-image.json: ' + str(exc), file=sys.stderr)
                sys.exit(1)

            results = data.get('Results')
            if results is None:
                print('[TRIVY-PARSER] FAIL: Results key is missing from trivy-image.json', file=sys.stderr)
                sys.exit(1)
            if not isinstance(results, list):
                print('[TRIVY-PARSER] FAIL: Results must be a list', file=sys.stderr)
                sys.exit(1)

            has_fixable = False
            exceptions = []
            for result in results:
                vulns = result.get('Vulnerabilities') or []
                for vuln in vulns:
                    if vuln.get('Severity') not in ('HIGH', 'CRITICAL'):
                        continue
                    fixable = vuln.get('FixedVersion', '')
                    if fixable:
                        has_fixable = True
                        pkg = vuln.get('PkgName', '?')
                        vid = vuln.get('VulnerabilityID', '?')
                        ver = vuln.get('InstalledVersion', '?')
                        print('[TRIVY-PARSER] FIXABLE: ' + vid + ' in ' + pkg + ' ' + ver + ' (fix: ' + fixable + ')', file=sys.stderr)
                    else:
                        sev = vuln.get('Severity', '')
                        vid = vuln.get('VulnerabilityID', '?')
                        pkg = vuln.get('PkgName', '?')
                        status = vuln.get('Status', 'unknown')
                        exceptions.append('[TRIVY-PARSER] EXCEPTION: ' + sev + ' ' + vid + ' ' + pkg + ' - status: ' + status + ' (no FixAvailable, see ADR-0026)')

            for line in exceptions[:10]:
                print(line, file=sys.stderr)
            if exceptions:
                print('exception: ' + str(len(exceptions)) + ' HIGH/CRITICAL unfixed - see ADR-0026', file=sys.stderr)

            if has_fixable:
                sys.exit(1)

      - name: Record any no-fix HIGH/CRITICAL as an explicit exception
        if: always()
        run: |
          set -euo pipefail
          if [ -f trivy-image.json ]; then
            UNFIXED=$(          python3 -c |-2
            import json, sys
            try:
                with open('trivy-image.json') as fh:
                    data = json.load(fh)
            except Exception:
                sys.exit(0)
            rows = []
            for result in (data.get('Results') or []):
                for item in (result.get('Vulnerabilities') or []):
                    if item.get('Severity') not in ('HIGH', 'CRITICAL'):
                        continue
                    if item.get('FixedVersion'):
                        continue
                    sev = item.get('Severity', '')
                    vid = item.get('VulnerabilityID', '?')
                    pkg = item.get('PkgName', '?')
                    ver = item.get('InstalledVersion', '?')
                    status = item.get('Status', 'unknown')
                    rows.append('- ' + sev + ' ' + vid + ' in ' + pkg + ' ' + ver + ' (status: ' + status + ')')
            if rows:
                print('\n'.join(rows))
          || true)
            echo "## No-fix HIGH/CRITICAL (exception - does not block gate)" >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${UNFIXED}" ]; then
              echo "${UNFIXED}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "None." >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Cleanup intermediate image
        if: always()
        run: docker rmi retailtwin-api:scan || true
