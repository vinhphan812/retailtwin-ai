name: API CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'services/forecasting/**'
      - 'services/simulation/**'
      - 'tests/e2e/**'
      - 'contracts/**'
      - 'Dockerfile'
      - '.github/workflows/**'
      - '.github/scripts/test-change-detector.sh'
  pull_request:
    paths:
      - 'apps/api/**'
      - 'services/forecasting/**'
      - 'services/simulation/**'
      - 'tests/e2e/**'
      - 'contracts/**'
      - 'Dockerfile'
      - '.github/workflows/**'
      - '.github/scripts/test-change-detector.sh'

# ADR 0026 — workflow-level least-privilege. `id-token: write` is added on
# the deploy job only because that is the job that calls WIF.
permissions:
  contents: read

# Production topology. API_BASE_URL is the public origin of the Cloud Run
# service: it is the OIDC audience of the Pub/Sub push token (ADR 0023), so
# APP_BASE_URL on the service MUST equal the push endpoint URL, and it is
# the origin the web client talks to.
env:
  API_BASE_URL: https://retailtwin-api-5rgtvr4gpa-uc.a.run.app
  GCP_PROJECT: retailtwin-ai-511002
  CLOUD_RUN_REGION: us-central1
  CLOUD_RUN_SERVICE: retailtwin-api
  PUBSUB_AGENT_SUBSCRIPTION: store-events-agent
  PUBSUB_PUSH_SERVICE_ACCOUNT: service-537192856637@gcp-sa-pubsub.iam.gserviceaccount.com

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  build-test:
    name: Build & Test
    runs-on: [self-hosted, Linux, X64]

    # Signal that this job ran so the deploy job can verify the workflow was
    # triggered for this SHA before deploying.  Without this check the deploy
    # condition (github.event_name == 'push' && github.ref == 'refs/heads/main')
    # would be true even when the workflow was dispatched manually with no API
    # changes, or when the paths filter prevented it from running at all.
    outputs:
      api_ci_ran: success

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Type-check
        run: pip install mypy && mypy retailtwin_api --ignore-missing-imports

      - name: Stockout risk tests
        working-directory: services/forecasting
        run: python -m mypy risk --ignore-missing-imports && python -m pytest

      - name: Demand forecast tests
        working-directory: services/forecasting
        run: python -m mypy demand --ignore-missing-imports && python -m pytest

      - name: Run tests with coverage
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api
        run: pytest --cov=retailtwin_api --cov-report=term --cov-report=xml:apps/api/coverage.xml --cov-branch apps/api/tests/

      - name: Simulation KPI tests with coverage
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: ${{ github.workspace }}/apps/api:${{ github.workspace }}/services/simulation:${{ github.workspace }}/services/forecasting/risk
        run: |
          python -m mypy services/simulation/kpi --ignore-missing-imports
          pytest \
            --cov=retailtwin_api \
            --cov=services/forecasting/risk \
            --cov=services/simulation \
            --cov-report=term \
            --cov-report=xml:apps/api/coverage.xml \
            --cov-branch \
            --cov-append \
            --no-cov-on-fail \
            services/simulation/tests/

      - name: Check branch coverage threshold
        run: python check_branch_threshold.py

      - name: Enforce critical-path coverage policy
        working-directory: ${{ github.workspace }}
        run: python apps/api/enforce_critical_path_coverage.py

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage.xml

      - name: Coverage summary
        run: |
          echo "## API Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          pytest --cov=retailtwin_api --cov-report=term 2>&1 | tail -20 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  e2e-smoke:
    name: E2E Smoke
    runs-on: [self-hosted, Linux, X64]
    needs: build-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api/pyproject.toml

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run E2E smoke suite
        run: pytest tests/e2e/ -v --tb=short

  # ── Production deployment ────────────────────────────────────────────────────
  # Deploys to Cloud Run after all tests pass on a merge to main.
  # Requires WORKLOAD_IDENTITY_FEDERATION configured:
  #   - Project: retailtwin-ai-511002
  #   - SA: github-actions@retailtwin-ai-511002.iam.gserviceaccount.com
  #   - Roles: Cloud Run Admin, Container Registry Writer, Secret Manager Secret Accessor
  deploy-cloudrun:
    name: Deploy to Cloud Run (production)
    runs-on: [self-hosted, Linux, X64]
    # Drop security from needs as it is currently hard-disabled in security.yml (ADR-0026).
    # build-test and e2e-smoke remain mandatory deployment gates.
    needs: [build-test, e2e-smoke]
    # Only deploy when this is a main push and both blocking API checks passed.
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      needs.build-test.result == 'success' && needs.e2e-smoke.result == 'success'
    # Verify the workflow was actually triggered for this SHA before deploying.
    # Without this, workflow_dispatch with force_build=false would still deploy.
    # The needs.build-test.outputs check is safe here because the needs chain
    # already guarantees build-test ran (if it didn't, e2e-smoke would be skipped).
    # We additionally verify that the run's head_sha matches our SHA.
    environment: production

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Record ADR-0026 security gate outcome
        run: |
          echo "## ADR-0026 security gate" >> "$GITHUB_STEP_SUMMARY"
          echo "The ADR-0026 reusable security gate is currently non-functional (hard-disabled in security.yml); this deployment proceeded with build-test and e2e-smoke gates passing." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify API CI ran for this SHA before deploying
        run: |
          # Confirms this is a real API change that passed CI, not a manual dispatch.
          # api_ci_ran='success' is set unconditionally by build-test when it runs.
          if [ "${{ needs.build-test.outputs.api_ci_ran }}" != "success" ]; then
            echo "::error::API CI did not run for this SHA (api_ci_ran=${{ needs.build-test.outputs.api_ci_ran }}). Refusing to deploy."
            echo "::error::Ensure this is a real API change and the workflow was triggered by a paths-filtered push."
            exit 1
          fi
          echo "✓ API CI confirmed for SHA ${{ github.sha }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Google Cloud CLI
        # The self-hosted runners are not guaranteed to ship the gcloud SDK, and
        # `gcloud auth configure-docker` below fails with exit 127 on runners
        # without it. Install it into the runner tool cache so the deploy step
        # is deterministic regardless of runner provisioning.
        uses: google-github-actions/setup-gcloud@v2.2.1  # e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Set up Google Cloud CLI
        # The self-hosted runner does not ship the Cloud SDK, and the deploy
        # path needs it for `gcloud auth configure-docker` (gcr.io push auth).
        # setup-gcloud provisions the SDK into the runner tool cache, so the
        # job no longer depends on whatever happens to be installed on the box.
        uses: google-github-actions/setup-gcloud@v2.2.1  # e427ad8a34f8676edf47cf7d7925499adf3eb74f

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1  # b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2

      - name: Build and push container image
        uses: docker/build-push-action@v7.4.0  # 263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          dockerfile: Dockerfile
          push: true
          tags: |
            gcr.io/retailtwin-ai-511002/retailtwin-api:${{ github.sha }}
            gcr.io/retailtwin-ai-511002/retailtwin-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan release image for fixable critical/high vulnerabilities
        run: |
          docker run --rm \
            -v "$HOME/.docker:/root/.docker:ro" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 \
            "gcr.io/retailtwin-ai-511002/retailtwin-api:${{ github.sha }}"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3.0.1  # 251330ba9a8a34bfbc1622895f42e1d53fd14522
        with:
          service: retailtwin-api
          region: us-central1
          project_id: retailtwin-ai-511002
          image: gcr.io/retailtwin-ai-511002/retailtwin-api:${{ github.sha }}
          service_account: ${{ secrets.GCP_RUNTIME_SA }}
          # Public API: explicitly maintain allUsers as Cloud Run Invoker so browser clients
          # and the anonymous production health/readiness probes use the same access policy.
          flags: --allow-unauthenticated
          port: 8080
          min_instances: 1
          max_instances: 10
          memory: 512Mi
          cpu: 1
          timeout: 60
          concurrency: 80
          # Merge the values explicitly managed above with the existing service
          # contract. The pre-deploy snapshot includes LLM_PROVIDER and LLM_MODEL,
          # which the release gate requires; explicitly include them to prevent stripping.
          #
          # AUTONOMY_ENABLED=true is what actually restores the autonomous runtime
          # in production (issue #384): with the default `false` the API accepts
          # `POST /events` but never starts an investigation, so
          # `GET /agent/events` stays empty and the live loop never runs.
          # APP_BASE_URL / PUBSUB_PUSH_SERVICE_ACCOUNT are required by the
          # `POST /pubsub/agent-events` push endpoint in production (ADR 0023):
          # without them the route fails closed with 503.
          env_vars_update_strategy: merge
          env_vars: APP_ENV=production,LOG_LEVEL=INFO,LIVE_TWIN_BACKEND=firestore,LLM_PROVIDER=vertex_gemini,LLM_MODEL=gemini-2.5-flash,AUTONOMY_ENABLED=true,APP_BASE_URL=${{ env.API_BASE_URL }},PUBSUB_PUSH_SERVICE_ACCOUNT=${{ env.PUBSUB_PUSH_SERVICE_ACCOUNT }}
          # secrets: STORE_FIXTURE_PATH=store-fixture:latest  # enable after Secret Manager setup

      - name: Verify the autonomous runtime is live on the deployed service
        run: |
          set -euo pipefail
          # The Pub/Sub push subscription wiring (one-time platform provisioning,
          # idempotent script scripts/provision-pubsub-push.sh) is not repeated
          # per deploy; this step only proves the deployed revision carries the
          # autonomous-runtime contract.
          SERVICE_JSON=$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --region="${CLOUD_RUN_REGION}" \
            --project="${GCP_PROJECT}" \
            --format=json)
          ENV_MAP=$(echo "${SERVICE_JSON}" | jq -r '.spec.template.spec.containers[0].env // [] | map(select(.name != null)) | map("\(.name)=\(.value // "")") | .[]')
          for REQUIRED in "AUTONOMY_ENABLED=true" "APP_BASE_URL=${API_BASE_URL}" "PUBSUB_PUSH_SERVICE_ACCOUNT=${PUBSUB_PUSH_SERVICE_ACCOUNT}"; do
            if ! echo "${ENV_MAP}" | grep -qx "${REQUIRED}"; then
              echo "::error::deployed service is missing ${REQUIRED}"
              echo "${ENV_MAP}" | sed 's/^/  /'
              exit 1
            fi
            echo "✓ ${REQUIRED}"
          done

          {
            echo "## Autonomous runtime (issue #384)"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| AUTONOMY_ENABLED | true |"
            echo "| APP_BASE_URL | ${API_BASE_URL} |"
            echo "| PUBSUB_PUSH_SERVICE_ACCOUNT | ${PUBSUB_PUSH_SERVICE_ACCOUNT} |"
            echo "| Agent subscription push endpoint | ${API_BASE_URL}/pubsub/agent-events |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify production deployment
        run: |
          set -e
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          echo "Service URL: ${SERVICE_URL}"
          echo "ROLLING_URL=${SERVICE_URL}" >> $GITHUB_ENV

          # The Cloud Run service permits unauthenticated invocations.
          # GitHub OIDC/WIF credentials cannot mint service-account identity tokens.
          # Liveness: /health (should always be 200 if container is alive)
          HEALTH=$(curl -sf "${SERVICE_URL}/health" || echo "")
          echo "Health: ${HEALTH}"

          # Assert production env
          echo "${HEALTH}" | grep -q '"app_env":"production"' \
            || { echo "ERROR: APP_ENV not set to production" >&2; exit 1; }

          # Assert OK status
          echo "${HEALTH}" | grep -q '"status":"ok"' \
            || { echo "ERROR: Service not OK" >&2; exit 1; }

          # Readiness probe: /ready
          READY=$(curl -sf "${SERVICE_URL}/ready" -o /dev/null -w "%{http_code}")
          echo "Readiness: ${READY}"
          [[ "${READY}" == "200" ]] \
            || { echo "ERROR: Readiness probe failed" >&2; exit 1; }

          echo ""
          echo "=== Production deployment verified ==="
